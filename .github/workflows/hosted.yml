name: Hosted Audiophile journey
# Runs the synthetic order (and, once registered, account) journey against the
# protected Preview after each successful Preview deploy of the registered
# branch, or on demand. Stripe test mode only; fictional buyers only.
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosted-audiophile
  cancel-in-progress: false
jobs:
  target:
    # Decides whether this deployment is the registered branch's head. It has
    # no environment, so other branches' previews skip instead of failing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.target.outputs.run }}
    steps:
      - id: target
        env:
          BRANCH: ${{ vars.AUDIOPHILE_PREVIEW_BRANCH }}
          PREVIEW_URL: ${{ vars.AUDIOPHILE_PREVIEW_URL }}
          DEPLOYED: ${{ github.event.deployment.sha }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$BRANCH" ] || [ -z "$PREVIEW_URL" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "AUDIOPHILE_PREVIEW_BRANCH or AUDIOPHILE_PREVIEW_URL is not set."; exit 0; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          head=$(gh api "repos/$REPOSITORY/branches/$BRANCH" --jq .commit.sha 2>/dev/null || true)
          if [ "$head" = "$DEPLOYED" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "Deployment $DEPLOYED is not the head of $BRANCH."; fi
  hosted:
    needs: target
    if: needs.target.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secrets live on this branch-limited environment, not the repository.
    environment: hosted-preview
    env:
      AUDIOPHILE_PREVIEW_URL: ${{ vars.AUDIOPHILE_PREVIEW_URL }}
    steps:
      - name: Wait for the registered origin to serve this deployment
        if: github.event_name == 'deployment_status'
        env:
          DEPLOYMENT_URL: ${{ github.event.deployment_status.target_url }}
          BYPASS: ${{ secrets.AUDIOPHILE_PREVIEW_BYPASS }}
        run: |
          [[ "$DEPLOYMENT_URL" =~ ^https://audiophile-[a-z0-9]+-royer-adames-projects\.vercel\.app$ ]] || { echo "Unexpected deployment URL."; exit 1; }
          sleep 5
          for attempt in $(seq 1 30); do
            served=$(curl -fsS -H "x-vercel-protection-bypass: $BYPASS" "$AUDIOPHILE_PREVIEW_URL/" | grep -o 'dpl_[A-Za-z0-9]*' | head -1 || true)
            wanted=$(curl -fsS -H "x-vercel-protection-bypass: $BYPASS" "$DEPLOYMENT_URL/" | grep -o 'dpl_[A-Za-z0-9]*' | head -1 || true)
            [ -n "$wanted" ] && [ "$served" = "$wanted" ] && exit 0
            sleep 10
          done
          echo "The registered origin never served this deployment."; exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.hosted.config.ts
        env:
          PLAYWRIGHT_CHANNEL: chromium
          AUDIOPHILE_PREVIEW_BYPASS: ${{ secrets.AUDIOPHILE_PREVIEW_BYPASS }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          ACCOUNTS_PREVIEW_BYPASS: ${{ secrets.ACCOUNTS_PREVIEW_BYPASS }}
          AUTH_PREVIEW_SINK_TOKEN: ${{ secrets.AUTH_PREVIEW_SINK_TOKEN }}
      - name: Remove synthetic orders and accounts
        if: always()
        run: node scripts/cleanup-suite-data.mjs
        env:
          AUDIOPHILE_DATABASE_URL: ${{ secrets.AUDIOPHILE_DATABASE_URL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: hosted-audiophile-results
          path: |
            test-results-hosted/**/*.png
            test-results-hosted/**/error-context.md
          if-no-files-found: ignore
          retention-days: 7
